[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxni"
version = "0.1.0"
description = "RXNI: reaction semantics and retrieval for chemical transformations"
requires-python = ">=3.10"
# Production dependencies and licensing remain to be audited at R4.
dependencies = [
  "rdkit>=2023.9",
  "pyarrow>=14",
  "pydantic>=1.10,<3",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rxni*"]

[project.scripts]
"rxni" = "rxni.cli_analysis:main"
"rxni-summary" = "rxni.cli_summary:main"
"rxni-batch" = "rxni.batch_cli:main"

"rxni-build-library" = "rxni.builder.cli:main"
[project.optional-dependencies]
api = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
]
cli = [
  "typer>=0.12,<1",
  "rich>=13,<16",
]
dev = [
  "pytest>=7",
  "httpx>=0.27,<1",
  "build>=1",
  "twine>=5",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
rxni = ["semantic/contracts/fgi_contracts_v1.json", "builder/builder_provenance.json"]

readme = "README.md"
